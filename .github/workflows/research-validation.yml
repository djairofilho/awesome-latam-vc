name: Research validation

on:
  pull_request:
    paths:
      - "funds/**"
      - "ecosystem/**"
      - "data/**"
      - "research/epic-*/**"
      - "research/seo-geo/**"
      - "translations/**"
      - "tools/research/**"
      - "tools/seo_geo/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "README.pt.md"
      - "README.es.md"
      - ".github/workflows/research-validation.yml"
  push:
    branches:
      - main
    paths:
      - "funds/**"
      - "ecosystem/**"
      - "data/**"
      - "research/epic-*/**"
      - "research/seo-geo/**"
      - "translations/**"
      - "tools/research/**"
      - "tools/seo_geo/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "README.pt.md"
      - "README.es.md"
      - ".github/workflows/research-validation.yml"
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git revision used as the validation baseline
        required: false
        default: "HEAD^"

permissions:
  contents: read

jobs:
  validate:
    name: Validate profiles and indexes
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref || 'HEAD^' }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.10.2"

      - name: Install research dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --no-sync pytest -n auto

      - name: Check final epic audits
        run: |
          uv run --no-sync python research/epic-65/final-audit/audit.py --check
          uv run --no-sync python research/epic-327/final-audit/audit.py --check

      - name: Validate editorial content
        run: uv run --no-sync python tools/seo_geo/validate_editorial.py

      - name: Validate locale routes and translation associations
        run: uv run --no-sync python tools/seo_geo/validate_i18n.py

      - name: Check translated index synchronization
        run: uv run --no-sync python tools/research/generate_indexes.py --check

      - name: Validate changed research artifacts
        run: uv run --no-sync python tools/research/validate.py --base-ref "$BASE_REF"
