name: Validate static site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build without deployment
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_ENV: preview
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.10.2"

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate deterministic static build
        run: npm run verify
