name: Validate static site

on:
  pull_request:
    paths:
      - "funds/**"
      - "ecosystem/**"
      - "translations/**"
      - "data/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/site-build.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build without deployment
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_ENV: preview
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deterministic static build
        run: npm run verify
