name: Website bug
description: Report a problem with the website, search, filters, or navigation.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Awesome LatAm VC.
  - type: input
    id: page
    attributes:
      label: Affected page
      placeholder: https://djairofilho.github.io/awesome-latam-vc/en/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 141 on Windows 11
